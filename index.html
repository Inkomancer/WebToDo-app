<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo Lists</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5a67d8;
            --bg: #f7fafc;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-light: #718096;
            --border: #e2e8f0;
            --success: #48bb78;
            --danger: #f56565;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        /* Auth Section */
        .auth-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 50px auto;
        }

        .auth-section h2 {
            margin-bottom: 20px;
            color: var(--text);
        }

        .auth-section p {
            color: var(--text-light);
            margin-bottom: 20px;
        }

        .google-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .google-btn:hover {
            border-color: var(--primary);
            background: var(--bg);
        }

        .google-btn img {
            width: 20px;
            height: 20px;
        }

        .user-info {
            display: none;
            align-items: center;
            gap: 15px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .user-info.active {
            display: flex;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .user-name {
            flex: 1;
            font-weight: 500;
        }

        .logout-btn {
            padding: 8px 16px;
            background: var(--border);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: var(--danger);
            color: white;
        }

        /* Tabs */
        .tabs-container {
            background: var(--card-bg);
            border-radius: 12px 12px 0 0;
            padding: 10px 10px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .tab {
            padding: 10px 20px;
            background: var(--bg);
            border: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-light);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab:hover {
            background: var(--border);
        }

        .tab.active {
            background: var(--primary);
            color: white;
        }

        .tab .remove-tab {
            opacity: 0;
            background: rgba(255,255,255,0.3);
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
            transition: opacity 0.2s;
        }

        .tab:hover .remove-tab,
        .tab.active .remove-tab {
            opacity: 1;
        }

        .tab .remove-tab:hover {
            background: var(--danger);
        }

        .add-tab-btn {
            padding: 10px 20px;
            background: transparent;
            border: 2px dashed var(--border);
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-light);
            transition: all 0.2s;
        }

        .add-tab-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Content Area */
        .content {
            background: var(--card-bg);
            border-radius: 0 0 12px 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .add-item-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .add-item-form input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .add-item-form input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .add-item-form button {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-item-form button:hover {
            background: var(--primary-dark);
        }

        /* Todo Items */
        .todo-list {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .todo-item:hover {
            border-color: var(--primary);
            background: var(--bg);
        }

        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-light);
        }

        .todo-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-radius: 6px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .todo-item.completed .todo-checkbox {
            background: var(--success);
            border-color: var(--success);
        }

        .todo-checkbox::after {
            content: '✓';
            color: white;
            font-size: 14px;
            display: none;
        }

        .todo-item.completed .todo-checkbox::after {
            display: block;
        }

        .todo-text {
            flex: 1;
            font-size: 16px;
        }

        .delete-item {
            opacity: 0;
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 18px;
            padding: 5px 10px;
            transition: opacity 0.2s;
        }

        .todo-item:hover .delete-item {
            opacity: 1;
        }

        .delete-item:hover {
            color: #c53030;
        }

        /* End Day Button */
        .end-day-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid var(--border);
            text-align: center;
        }

        .end-day-btn {
            padding: 12px 30px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .end-day-btn:hover {
            background: #38a169;
        }

        .completed-count {
            margin-top: 10px;
            color: var(--text-light);
            font-size: 14px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }

        .empty-state p {
            font-size: 18px;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
        }

        .modal h2 {
            margin-bottom: 20px;
            color: var(--primary);
        }

        .modal input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .modal-btn.cancel {
            background: var(--bg);
            color: var(--text);
        }

        .modal-btn.confirm {
            background: var(--primary);
            color: white;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .tabs {
                justify-content: flex-start;
            }

            .tab {
                padding: 8px 12px;
                font-size: 13px;
            }

            .add-item-form {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My Todo Lists</h1>
        </header>

        <!-- Auth Section -->
        <div id="authSection" class="auth-section">
            <h2>Welcome!</h2>
            <p>Sign in with Google to sync your todos across all devices</p>
            <button class="google-btn" onclick="signInWithGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Sign in with Google
            </button>
        </div>

        <!-- User Info -->
        <div id="userInfo" class="user-info">
            <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
            <span id="userName" class="user-name"></span>
            <button class="logout-btn" onclick="signOut()">Sign Out</button>
        </div>

        <!-- App Content (hidden until signed in) -->
        <div id="appContent" style="display: none;">
            <div class="tabs-container">
                <div class="tabs" id="tabs"></div>
            </div>

            <div class="content">
                <div class="add-item-form">
                    <input type="text" id="newItemInput" placeholder="Add a new task..." />
                    <button onclick="addItem()">Add Task</button>
                </div>

                <div class="loading" id="loadingState" style="display: none;">
                    <div class="loading-spinner"></div>
                    <p>Syncing your todos...</p>
                </div>

                <ul class="todo-list" id="todoList"></ul>

                <div class="end-day-section">
                    <button class="end-day-btn" onclick="endDay()">🌙 End Day - Remove Completed</button>
                    <p class="completed-count" id="completedCount"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Category Modal -->
    <div class="modal-overlay" id="addCategoryModal">
        <div class="modal">
            <h2>Add New Category</h2>
            <input type="text" id="newCategoryInput" placeholder="Category name..." />
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-btn confirm" onclick="confirmAddCategory()">Add</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, arrayUnion, arrayRemove } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // ============================================
        // Firebase Configuration
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDtfuAhRO_k83Z1VAsfq6jJVydIg6TbJ2o",
            authDomain: "webtodo-813c2.firebaseapp.com",
            projectId: "webtodo-813c2",
            storageBucket: "webtodo-813c2.firebasestorage.app",
            messagingSenderId: "438536918685",
            appId: "1:438536918685:web:edae29f682b1efb8aae674"
        };
        // ============================================

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // State
        let currentUser = null;
        let userData = {
            categories: ['General', 'Work', 'Home'],
            currentCategory: 'General',
            todos: {
                'General': [],
                'Work': [],
                'Home': []
            }
        };
        let unsubscribeSnapshot = null;

        // Auth state observer
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                // User signed in
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('userInfo').classList.add('active');
                document.getElementById('appContent').style.display = 'block';
                document.getElementById('userAvatar').src = user.photoURL;
                document.getElementById('userName').textContent = user.displayName;

                // Show loading
                document.getElementById('loadingState').style.display = 'block';
                document.getElementById('todoList').innerHTML = '';

                // Load/sync user data from Firestore
                await loadUserData();
            } else {
                // User signed out
                document.getElementById('authSection').style.display = 'block';
                document.getElementById('userInfo').classList.remove('active');
                document.getElementById('appContent').style.display = 'none';
                if (unsubscribeSnapshot) {
                    unsubscribeSnapshot();
                    unsubscribeSnapshot = null;
                }
            }
        });

        // Load user data from Firestore
        async function loadUserData() {
            try {
                const userRef = doc(db, 'users', currentUser.uid);
                
                // Listen for real-time updates
                unsubscribeSnapshot = onSnapshot(userRef, 
                    (docSnap) => {
                        if (docSnap.exists()) {
                            userData = docSnap.data();
                            // Ensure todos object has all categories
                            userData.categories.forEach(cat => {
                                if (!userData.todos[cat]) {
                                    userData.todos[cat] = [];
                                }
                            });
                        } else {
                            // First time user - create document
                            saveUserData();
                        }
                        document.getElementById('loadingState').style.display = 'none';
                        render();
                    },
                    (error) => {
                        console.error("Error loading data:", error);
                        document.getElementById('loadingState').style.display = 'none';
                        alert('Error loading todos. Please refresh the page.');
                    }
                );
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('loadingState').style.display = 'none';
            }
        }

        // Save user data to Firestore
        async function saveUserData() {
            if (!currentUser) return;
            
            try {
                const userRef = doc(db, 'users', currentUser.uid);
                await setDoc(userRef, userData, { merge: true });
            } catch (error) {
                console.error("Error saving data:", error);
            }
        }

        // Make functions global for HTML onclick handlers
        window.signInWithGoogle = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Sign in error:", error);
                alert('Sign in failed: ' + error.message);
            }
        };

        window.signOut = async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Sign out error:", error);
            }
        };

        // Render everything
        function render() {
            renderTabs();
            renderTodos();
            updateCompletedCount();
        }

        // Render tabs
        function renderTabs() {
            const tabsContainer = document.getElementById('tabs');
            tabsContainer.innerHTML = '';

            userData.categories.forEach(cat => {
                const tab = document.createElement('button');
                tab.className = `tab ${cat === userData.currentCategory ? 'active' : ''}`;
                tab.innerHTML = `
                    ${cat}
                    ${userData.categories.length > 1 ? '<button class="remove-tab" onclick="event.stopPropagation(); removeCategory(\'' + cat + '\')">×</button>' : ''}
                `;
                tab.onclick = () => switchCategory(cat);
                tabsContainer.appendChild(tab);
            });

            const addBtn = document.createElement('button');
            addBtn.className = 'add-tab-btn';
            addBtn.textContent = '+ Add Category';
            addBtn.onclick = openModal;
            tabsContainer.appendChild(addBtn);
        }

        // Render todos for current category
        function renderTodos() {
            const list = document.getElementById('todoList');
            const todos = userData.todos[userData.currentCategory] || [];

            if (todos.length === 0) {
                list.innerHTML = '<div class="empty-state"><p>No tasks yet. Add one above!</p></div>';
                return;
            }

            list.innerHTML = '';
            todos.forEach((todo, index) => {
                const item = document.createElement('li');
                item.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                item.innerHTML = `
                    <div class="todo-checkbox"></div>
                    <span class="todo-text">${escapeHtml(todo.text)}</span>
                    <button class="delete-item" onclick="event.stopPropagation(); deleteItem(${index})">🗑</button>
                `;
                item.onclick = (e) => {
                    if (e.target.className !== 'delete-item') {
                        toggleItem(index);
                    }
                };
                list.appendChild(item);
            });
        }

        // Update completed count
        function updateCompletedCount() {
            const todos = userData.todos[userData.currentCategory] || [];
            const completed = todos.filter(t => t.completed).length;
            document.getElementById('completedCount').textContent = 
                `${completed} of ${todos.length} tasks completed`;
        }

        // Switch category
        async function switchCategory(cat) {
            userData.currentCategory = cat;
            await saveUserData();
            render();
        }

        // Expose functions to global scope
        window.switchCategory = switchCategory;

        // Modal functions
        window.openModal = () => {
            document.getElementById('addCategoryModal').classList.add('active');
            document.getElementById('newCategoryInput').focus();
        };

        window.closeModal = () => {
            document.getElementById('addCategoryModal').classList.remove('active');
            document.getElementById('newCategoryInput').value = '';
        };

        window.confirmAddCategory = async () => {
            const name = document.getElementById('newCategoryInput').value.trim();
            if (name && !userData.categories.includes(name)) {
                userData.categories.push(name);
                userData.todos[name] = [];
                userData.currentCategory = name;
                await saveUserData();
                render();
            }
            closeModal();
        };

        // Remove category
        window.removeCategory = async (cat) => {
            if (userData.categories.length <= 1) {
                alert('You need at least one category!');
                return;
            }
            if (confirm(`Remove "${cat}" and all its tasks?`)) {
                const index = userData.categories.indexOf(cat);
                userData.categories.splice(index, 1);
                delete userData.todos[cat];
                userData.currentCategory = userData.categories[Math.max(0, index - 1)];
                await saveUserData();
                render();
            }
        };

        // Add todo item
        async function addItem() {
            const input = document.getElementById('newItemInput');
            const text = input.value.trim();
            if (!text) return;

            if (!userData.todos[userData.currentCategory]) {
                userData.todos[userData.currentCategory] = [];
            }

            userData.todos[userData.currentCategory].push({
                text: text,
                completed: false,
                createdAt: Date.now()
            });

            input.value = '';
            await saveUserData();
            render();
        }

        // Enter key to add
        document.getElementById('newItemInput').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') await addItem();
        });

        document.getElementById('newCategoryInput').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') await confirmAddCategory();
        });

        // Toggle item
        async function toggleItem(index) {
            userData.todos[userData.currentCategory][index].completed = 
                !userData.todos[userData.currentCategory][index].completed;
            await saveUserData();
            render();
        }

        // Delete item
        async function deleteItem(index) {
            userData.todos[userData.currentCategory].splice(index, 1);
            await saveUserData();
            render();
        }

        // End day - remove completed
        async function endDay() {
            const todos = userData.todos[userData.currentCategory] || [];
            const completedCount = todos.filter(t => t.completed).length;
            
            if (completedCount === 0) {
                alert('No completed tasks to remove!');
                return;
            }

            if (confirm(`Remove ${completedCount} completed task(s)? This cannot be undone.`)) {
                userData.todos[userData.currentCategory] = todos.filter(t => !t.completed);
                await saveUserData();
                render();
            }
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Expose all functions to global scope for onclick handlers
        window.saveUserData = saveUserData;
        window.toggleItem = toggleItem;
        window.deleteItem = deleteItem;
        window.addItem = addItem;
        window.endDay = endDay;
    </script>
</body>
</html>
